# Round-robin load balancer in front of the ingestion-api replicas (profile "apps" in ../compose.yaml).
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream ingestion_api {
        # Docker's DNS returns one address per replica; nginx resolves them when it starts.
        server ingestion-api:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        # Above ingestion.max-request-body-size (1 MB), so the API itself answers oversized bodies with its 413.
        client_max_body_size 2m;

        # Only the public API; actuator endpoints of the replicas stay internal.
        location /v1/events {
            proxy_pass http://ingestion_api;
            # The default Host would be the upstream name, which Tomcat rejects (underscore) with a bare 400.
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
